name = "gozie-live"
main = "src/index.ts"
compatibility_date = "2026-11-24"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ORIGIN = "https://gozie-live.gozielive.workers.dev"
APP_BASE_PATH = "/gozie-live/"
REALTIME_SFU_APP_ID = "a15d31f644b96a0376362c254686ea40"

[[d1_databases]]
binding = "DB"
database_name = "gozie-live-db"
database_id = "67f8680e-5c19-4cc6-b082-65d12dc7846a"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "gozie-live-media"

[[durable_objects.bindings]]
name = "SESSION_ROOMS"
class_name = "SessionRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/health", "/v1/*"]

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1
