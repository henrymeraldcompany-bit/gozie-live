name = "gozie-live"
main = "src/index.ts"
compatibility_date = "2026-11-24"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ORIGIN = "https://gozie-live.gozielive.workers.dev"
APP_BASE_PATH = "/gozie-live/"
REALTIMEKIT_ACCOUNT_ID = "d210fdaad025b0bddf6276048c4e1957"
REALTIMEKIT_APP_ID = "40b677dd-61ec-4310-b75c-f2b66610ee7b"

[[d1_databases]]
binding = "DB"
database_name = "gozie-live-db"
database_id = "67f8680e-5c19-4cc6-b082-65d12dc7846a"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "gozie-live-media"

[[durable_objects.bindings]]
name = "SESSION_ROOMS"
class_name = "SessionRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]


[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1
