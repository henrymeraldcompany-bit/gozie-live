name: Deploy GOZIE LIVE to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "services/api/src/index.ts"
      - ".github/workflows/deploy-pages.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build the website
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_API_BASE_URL: ${{ vars.GOZIE_LIVE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.GOZIE_LIVE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.GOZIE_LIVE_SUPABASE_ANON_KEY }}

      - name: Upload the compiled website
        uses: actions/upload-pages-artifact@v4
        with:
          name: gozie-live-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: gozie-live-pages-${{ github.run_id }}-${{ github.run_attempt }}
