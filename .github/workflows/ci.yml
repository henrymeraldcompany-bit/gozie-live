name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - name: Build production website
        run: npm run build
        env:
          VITE_BASE_PATH: /gozie-live/
      - name: Bundle website into the Worker
        run: node scripts/embed-assets.mjs
      - name: Compile Cloudflare API Worker modules
        run: npx tsc -p services/api/tsconfig.json --noEmit false --outDir services/api/build
      - name: Assemble Cloudflare deployment artifact
        run: |
          mkdir -p cloudflare-deploy/worker cloudflare-deploy/assets
          cp services/api/build/index.js cloudflare-deploy/worker/index.js
          cp services/api/build/generated-assets.js cloudflare-deploy/worker/generated-assets.js
      - name: Upload Cloudflare deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: gozie-live-cloudflare-build
          path: cloudflare-deploy
          if-no-files-found: error
          retention-days: 7
      - name: Publish tested modules to cloudflare-build branch
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'cloudflare-build';
            let parentSha;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch });
              parentSha = ref.data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/' + branch, sha: context.sha });
              parentSha = context.sha;
            }
            const parent = await github.rest.git.getCommit({ owner, repo, commit_sha: parentSha });
            const files = [
              ['worker/index.js', 'services/api/build/index.js'],
              ['worker/generated-assets.js', 'services/api/build/generated-assets.js']
            ];
            const tree = [];
            for (const [path, source] of files) {
              const blob = await github.rest.git.createBlob({
                owner, repo, content: fs.readFileSync(source, 'utf8'), encoding: 'utf-8'
              });
              tree.push({ path, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            const newTree = await github.rest.git.createTree({
              owner, repo, base_tree: parent.data.tree.sha, tree
            });
            const commit = await github.rest.git.createCommit({
              owner, repo,
              message: 'Publish tested GOZIE LIVE Cloudflare Worker build',
              tree: newTree.data.sha,
              parents: [parentSha]
            });
            await github.rest.git.updateRef({
              owner, repo, ref: 'heads/' + branch, sha: commit.data.sha, force: true
            });
            core.info('Published Cloudflare modules at ' + commit.data.sha);
      - name: Validate API Worker configuration
        run: npx wrangler deploy --dry-run --config services/api/wrangler.toml
      - name: Validate static web Worker configuration
        run: npx wrangler deploy --dry-run --config apps/web/wrangler.toml
