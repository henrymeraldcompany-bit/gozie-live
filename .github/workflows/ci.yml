name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Validate API Worker bundle
        run: npx wrangler deploy --dry-run --config services/api/wrangler.toml
      - name: Validate static web Worker assets
        run: npx wrangler deploy --dry-run --config apps/web/wrangler.toml
